# nginx: proxy WebSocket verso il bridge + download del pacchetto .ehpk.
# Includi questi due blocchi dentro il tuo `server { ... }` HTTPS (con TLS già configurato).
#
# L'app WebView degli occhiali si connette a  wss://<tuo-dominio>/ws/matrix-g2
# e legge il bridge esposto in locale su 127.0.0.1:8792.

# --- Bridge WebSocket ---
location /ws/matrix-g2 {
    proxy_pass         http://127.0.0.1:8792;
    proxy_http_version 1.1;
    proxy_set_header   Upgrade    $http_upgrade;
    proxy_set_header   Connection "upgrade";
    proxy_set_header   Host       $host;
    proxy_read_timeout 86400s;   # il WS resta aperto a lungo: no timeout aggressivi
}

# --- Download del pacchetto app (opzionale: sideload via URL diretto) ---
location = /matrix-g2.ehpk {
    alias /var/www/matrix-g2/matrix-g2.ehpk;   # dove copi il .ehpk buildato
    default_type application/octet-stream;
    add_header Content-Disposition 'attachment; filename="matrix-g2.ehpk"';
}
